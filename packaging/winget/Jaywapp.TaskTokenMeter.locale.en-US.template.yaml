ShortDescription: Measures Claude Code and Codex CLI token usage per turn.
Description: |-
  Task Token Meter aggregates the token usage that Claude Code and Codex CLI write to their local
  session logs, grouped by root turn instead of by session. It reads provider usage records directly,
  removes duplicated entries, attributes subagent activity to the originating turn, and stores the
  result in a local SQLite ledger. Prompts, messages and tool arguments are never displayed or stored.
Moniker: task-token-meter
